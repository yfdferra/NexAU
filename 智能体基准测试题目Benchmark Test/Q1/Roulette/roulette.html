<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽奖转盘大转盘</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            position: relative;
        }

        /* 头部样式 */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.8rem;
            color: #2d3748;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .header p {
            font-size: 1.2rem;
            color: #4a5568;
        }

        /* 配置按钮样式 */
        .config-button {
            position: absolute;
            top: 30px;
            right: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .config-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .config-button:active {
            transform: translateY(0);
        }

        /* 主内容区域 */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        /* 转盘容器 */
        .wheel-container {
            position: relative;
            width: 500px;
            height: 500px;
            margin: 0 auto;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 5s linear;
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: #2d3748;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .pointer {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #e53e3e;
            z-index: 20;
        }

        /* 扇形样式 */
        .sector {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .sector-content {
            position: absolute;
            width: 160px;
            text-align: center;
            transform-origin: 0 0;
            left: 100%;
            top: 0;
            transform: rotate(45deg);
            padding: 3px;
        }

        .sector-text {
            font-size: 0.9rem;
            font-weight: 700;
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
            transform: rotate(-45deg);
            padding: 3px;
            text-align: center;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .start-button {
            background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.4rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(229, 62, 62, 0.4);
            min-width: 200px;
        }

        .start-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(229, 62, 62, 0.6);
        }

        .start-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .start-button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            box-shadow: none;
        }

        .result-display {
            font-size: 1.3rem;
            color: #2d3748;
            font-weight: 600;
            min-height: 30px;
            text-align: center;
        }

        /* 弹窗遮罩 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .modal-overlay.active {
            display: flex;
        }

        /* 配置弹窗 */
        .config-modal {
            background: white;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }

        .modal-header h2 {
            font-size: 1.8rem;
            color: #2d3748;
        }

        .close-button {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #718096;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
        }

        .close-button:hover {
            color: #e53e3e;
        }

        /* 配置表单 */
        .config-form {
            margin-bottom: 25px;
        }

        .config-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .config-item {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 15px;
            align-items: center;
            padding: 15px;
            background: #f7fafc;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .config-item input {
            padding: 10px 15px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .config-item input:focus {
            outline: none;
            border-color: #667eea;
        }

        .color-input {
            width: 100%;
            height: 40px;
            padding: 5px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            cursor: pointer;
        }

        .delete-button {
            background: #fc8181;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .delete-button:hover {
            background: #e53e3e;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .add-button {
            background: #48bb78;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .add-button:hover {
            background: #38a169;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
        }

        .save-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .save-button:hover {
            background: #5a67d8;
        }

        .cancel-button {
            background: #cbd5e0;
            color: #4a5568;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cancel-button:hover {
            background: #a0aec0;
        }

        /* 中奖弹窗 */
        .win-modal {
            background: linear-gradient(135deg, #f6e05e 0%, #d69e2e 100%);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: winModalAppear 0.5s ease;
        }

        @keyframes winModalAppear {
            0% {
                opacity: 0;
                transform: scale(0.8) rotate(-10deg);
            }
            50% {
                transform: scale(1.05) rotate(5deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        .win-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-10px);
            }
        }

        .win-title {
            font-size: 2.5rem;
            color: #744210;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .win-prize {
            font-size: 2.2rem;
            color: #d69e2e;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            box-shadow: 0 10px 30px rgba(214, 158, 46, 0.3);
        }

        .win-message {
            font-size: 1.3rem;
            color: #744210;
            margin-bottom: 30px;
        }

        .win-close-button {
            background: #744210;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(116, 66, 16, 0.4);
        }

        .win-close-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(116, 66, 16, 0.6);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .wheel-container {
                width: 300px;
                height: 300px;
            }
            
            .config-item {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .config-modal {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .wheel-container {
                width: 250px;
                height: 250px;
            }
            
            .start-button {
                padding: 15px 30px;
                font-size: 1.2rem;
            }
            
            .modal-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 配置按钮 -->
        <button class="config-button" id="configButton">
            ⚙️ 配置转盘
        </button>

        <!-- 头部 -->
        <div class="header">
            <h1>🎡 幸运抽奖大转盘</h1>
            <p>点击开始按钮，试试你的运气！</p>
        </div>

        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 转盘容器 -->
            <div class="wheel-container">
                <div class="pointer"></div>
                <div class="wheel" id="wheel">
                    <!-- 扇形区域将通过JavaScript动态生成 -->
                </div>
                <div class="wheel-center"></div>
            </div>

            <!-- 控制区域 -->
            <div class="controls">
                <button class="start-button" id="startButton">
                    🎯 开始抽奖
                </button>
                <div class="result-display" id="resultDisplay">
                    等待开始抽奖...
                </div>
            </div>
        </div>
    </div>

    <!-- 配置弹窗 -->
    <div class="modal-overlay" id="configModal">
        <div class="config-modal">
            <div class="modal-header">
                <h2>⚙️ 转盘配置</h2>
                <button class="close-button" id="closeConfigModal">×</button>
            </div>
            
            <div class="config-form">
                <div class="config-items" id="configItems">
                    <!-- 配置项将通过JavaScript动态生成 -->
                </div>
                
                <div class="form-actions">
                    <button class="add-button" id="addConfigItem">
                        ➕ 新增奖项
                    </button>
                </div>
            </div>
            
            <div class="modal-actions">
                <button class="cancel-button" id="cancelConfig">
                    取消
                </button>
                <button class="save-button" id="saveConfig">
                    💾 保存配置
                </button>
            </div>
        </div>
    </div>

    <!-- 中奖弹窗 -->
    <div class="modal-overlay" id="winModal">
        <div class="win-modal">
            <div class="win-icon">🎉</div>
            <h2 class="win-title">恭喜你！</h2>
            <div class="win-prize" id="winPrize"></div>
            <p class="win-message">获得以下奖励</p>
            <button class="win-close-button" id="closeWinModal">
                关闭
            </button>
        </div>
    </div>

    <script>
        // 默认配置数据
        const defaultConfig = [
            { name: "特等奖：iPhone 68", count: 1, color: "#FF0000" },
            { name: "一等奖：MacBook Pro", count: 2, color: "#FF6B6B" },
            { name: "二等奖：iPad Air", count: 3, color: "#4ECDC4" },
            { name: "三等奖：AirPods Pro", count: 4, color: "#FFD166" },
            { name: "四等奖：Apple Watch", count: 5, color: "#06D6A0" },
            { name: "五等奖：充电宝", count: 6, color: "#118AB2" },
            { name: "幸运奖：优惠券", count: 7, color: "#7209B7" },
            { name: "谢谢参与", count: 8, color: "#C8C8C8" }
        ];

        // 全局变量
        let currentConfig = JSON.parse(JSON.stringify(defaultConfig));
        let tempConfig = JSON.parse(JSON.stringify(defaultConfig));
        let isSpinning = false;
        let totalSectors = 0;
        let wheel = null;
        let configItemsContainer = null;
        let configModal = null;
        let winModal = null;

        // DOM加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            wheel = document.getElementById('wheel');
            configItemsContainer = document.getElementById('configItems');
            configModal = document.getElementById('configModal');
            winModal = document.getElementById('winModal');
            
            // 尝试从本地存储加载配置
            try {
                const savedConfig = localStorage.getItem('rouletteConfig');
                if (savedConfig) {
                    const parsedConfig = JSON.parse(savedConfig);
                    if (Array.isArray(parsedConfig) && parsedConfig.length > 0) {
                        currentConfig = parsedConfig;
                        console.log('从本地存储加载配置：', currentConfig);
                    }
                }
            } catch (e) {
                console.warn('无法从本地存储加载配置：', e);
            }
            
            // 初始化转盘
            renderWheel();
            
            // 初始化配置表单
            renderConfigForm();
            
            // 绑定事件监听器
            bindEvents();
        });

        // 渲染转盘
        function renderWheel() {
            wheel.innerHTML = '';
            totalSectors = 0;
            
            // 计算总扇形数
            currentConfig.forEach(item => {
                totalSectors += item.count;
            });
            
            // 计算每个扇形的角度
            const anglePerSector = 360 / totalSectors;
            let currentAngle = 0;
            let sectorIndex = 0;
            
            // 调试信息
            console.log('开始渲染转盘，配置：', currentConfig);
            console.log('总扇形数：', totalSectors);
            console.log('每个扇形角度：', anglePerSector);
            
            // 创建扇形
            currentConfig.forEach((item, itemIndex) => {
                for (let i = 0; i < item.count; i++) {
                    const sector = document.createElement('div');
                    sector.className = 'sector';
                    sector.dataset.index = sectorIndex;
                    sector.dataset.itemIndex = itemIndex;
                    
                    // 设置扇形样式
                    sector.style.backgroundColor = item.color;
                    sector.style.transform = `rotate(${currentAngle}deg)`;
                    
                    // 创建扇形内容
                    const sectorContent = document.createElement('div');
                    sectorContent.className = 'sector-content';
                    
                    const sectorText = document.createElement('div');
                    sectorText.className = 'sector-text';
                    
                    // 根据扇形大小调整文字显示
                    let displayText = item.name;
                    if (totalSectors > 20 && item.name.length > 10) {
                        // 如果扇形太多且文字太长，适当缩短
                        displayText = item.name.substring(0, 8) + '...';
                    }
                    
                    sectorText.textContent = displayText;
                    sectorText.title = item.name; // 添加完整文字的悬停提示
                    
                    sectorContent.appendChild(sectorText);
                    sector.appendChild(sectorContent);
                    wheel.appendChild(sector);
                    
                    // 调试信息
                    console.log(`创建扇形 ${sectorIndex}: 角度=${currentAngle}°, 颜色=${item.color}, 文字="${item.name}"`);
                    
                    currentAngle += anglePerSector;
                    sectorIndex++;
                }
            });
            
            // 更新结果显示
            document.getElementById('resultDisplay').textContent = `转盘已就绪（${totalSectors}个扇形），点击开始抽奖！`;
            
            // 调试信息
            console.log('转盘渲染完成，共创建', sectorIndex, '个扇形');
        }

        // 渲染配置表单
        function renderConfigForm() {
            configItemsContainer.innerHTML = '';
            
            tempConfig.forEach((item, index) => {
                const configItem = document.createElement('div');
                configItem.className = 'config-item';
                configItem.dataset.index = index;
                
                configItem.innerHTML = `
                    <input type="text" class="config-name" value="${item.name}" placeholder="奖项名称" data-index="${index}">
                    <input type="number" class="config-count" value="${item.count}" min="1" max="20" placeholder="数量" data-index="${index}">
                    <input type="color" class="color-input" value="${item.color}" data-index="${index}">
                    <button type="button" class="delete-button" data-index="${index}">删除</button>
                `;
                
                configItemsContainer.appendChild(configItem);
            });
        }

        // 绑定事件监听器
        function bindEvents() {
            // 开始抽奖按钮
            document.getElementById('startButton').addEventListener('click', startSpin);
            
            // 配置按钮
            document.getElementById('configButton').addEventListener('click', openConfigModal);
            
            // 关闭配置弹窗按钮
            document.getElementById('closeConfigModal').addEventListener('click', closeConfigModal);
            document.getElementById('cancelConfig').addEventListener('click', closeConfigModal);
            
            // 保存配置按钮
            document.getElementById('saveConfig').addEventListener('click', saveConfig);
            
            // 新增配置项按钮
            document.getElementById('addConfigItem').addEventListener('click', addConfigItem);
            
            // 关闭中奖弹窗按钮
            document.getElementById('closeWinModal').addEventListener('click', closeWinModal);
            
            // 点击遮罩层关闭弹窗
            configModal.addEventListener('click', function(e) {
                if (e.target === configModal) {
                    closeConfigModal();
                }
            });
            
            winModal.addEventListener('click', function(e) {
                if (e.target === winModal) {
                    closeWinModal();
                }
            });
            
            // 配置项输入变化监听
            configItemsContainer.addEventListener('input', function(e) {
                if (e.target.classList.contains('config-name') || 
                    e.target.classList.contains('config-count') || 
                    e.target.classList.contains('color-input')) {
                    const index = parseInt(e.target.dataset.index);
                    updateTempConfig(index, e.target.className, e.target.value);
                }
            });
            
            // 删除配置项按钮
            configItemsContainer.addEventListener('click', function(e) {
                if (e.target.classList.contains('delete-button')) {
                    const index = parseInt(e.target.dataset.index);
                    deleteConfigItem(index);
                }
            });
        }

        // 开始旋转转盘
        function startSpin() {
            if (isSpinning) return;
            
            const startButton = document.getElementById('startButton');
            const resultDisplay = document.getElementById('resultDisplay');
            
            // 禁用按钮
            isSpinning = true;
            startButton.disabled = true;
            startButton.textContent = '🎡 转盘中...';
            resultDisplay.textContent = '转盘旋转中...';
            
            // 重置转盘位置（确保从0度开始）
            wheel.style.transition = 'none';
            wheel.style.transform = 'rotate(0deg)';
            
            // 强制重绘
            void wheel.offsetWidth;
            
            // 计算随机停止位置
            const randomSector = Math.floor(Math.random() * totalSectors);
            const targetAngle = 360 * 5 + (360 / totalSectors) * randomSector; // 5圈 + 随机扇形
            
            // 应用旋转动画（使用线性动画确保恒定速度）
            wheel.style.transition = 'transform 5s linear';
            wheel.style.transform = `rotate(${targetAngle}deg)`;
            
            // 5秒后显示结果
            setTimeout(() => {
                // 获取中奖项
                const sectorIndex = randomSector % totalSectors;
                let cumulativeSectors = 0;
                let winningItem = null;
                
                for (const item of currentConfig) {
                    cumulativeSectors += item.count;
                    if (sectorIndex < cumulativeSectors) {
                        winningItem = item;
                        break;
                    }
                }
                
                // 更新UI
                resultDisplay.textContent = `恭喜获得：${winningItem.name}`;
                startButton.disabled = false;
                startButton.textContent = '🎯 开始抽奖';
                isSpinning = false;
                
                // 显示中奖弹窗
                showWinModal(winningItem.name);
                
            }, 5000);
        }

        // 打开配置弹窗
        function openConfigModal() {
            // 复制当前配置到临时配置
            tempConfig = JSON.parse(JSON.stringify(currentConfig));
            renderConfigForm();
            configModal.classList.add('active');
            
            // 调试信息
            console.log('打开配置弹窗，当前配置：', currentConfig);
            console.log('临时配置：', tempConfig);
        }

        // 关闭配置弹窗
        function closeConfigModal() {
            configModal.classList.remove('active');
        }

        // 保存配置
        function saveConfig() {
            // 验证配置
            if (!validateConfig()) {
                alert('请检查配置：\n1. 奖项名称不能为空\n2. 扇形数量必须为1-20的正整数\n3. 至少需要一个奖项');
                return;
            }
            
            // 确保临时配置是最新的（从表单中读取）
            updateTempConfigFromForm();
            
            // 更新当前配置
            currentConfig = JSON.parse(JSON.stringify(tempConfig));
            
            // 调试信息
            console.log('保存配置，新配置：', currentConfig);
            
            // 重新渲染转盘
            renderWheel();
            
            // 关闭弹窗
            closeConfigModal();
            
            // 显示成功消息
            document.getElementById('resultDisplay').textContent = '配置已保存，转盘已更新！';
            
            // 保存到本地存储（可选）
            try {
                localStorage.setItem('rouletteConfig', JSON.stringify(currentConfig));
                console.log('配置已保存到本地存储');
            } catch (e) {
                console.warn('无法保存到本地存储：', e);
            }
        }

        // 验证配置
        function validateConfig() {
            if (tempConfig.length === 0) return false;
            
            for (const item of tempConfig) {
                if (!item.name || item.name.trim() === '') return false;
                if (!item.count || item.count < 1 || item.count > 20) return false;
                if (!item.color || item.color.trim() === '') return false;
            }
            
            return true;
        }

        // 更新临时配置
        function updateTempConfig(index, field, value) {
            if (field === 'config-name') {
                tempConfig[index].name = value;
            } else if (field === 'config-count') {
                tempConfig[index].count = parseInt(value) || 1;
            } else if (field === 'color-input') {
                tempConfig[index].color = value;
            }
            
            // 调试信息
            console.log(`更新配置项 ${index} 的 ${field} 为 ${value}`);
            console.log('当前临时配置：', tempConfig);
        }
        
        // 从表单更新临时配置
        function updateTempConfigFromForm() {
            const nameInputs = document.querySelectorAll('.config-name');
            const countInputs = document.querySelectorAll('.config-count');
            const colorInputs = document.querySelectorAll('.color-input');
            
            for (let i = 0; i < tempConfig.length; i++) {
                if (nameInputs[i]) {
                    tempConfig[i].name = nameInputs[i].value;
                }
                if (countInputs[i]) {
                    tempConfig[i].count = parseInt(countInputs[i].value) || 1;
                }
                if (colorInputs[i]) {
                    tempConfig[i].color = colorInputs[i].value;
                }
            }
            
            console.log('从表单更新后的临时配置：', tempConfig);
        }

        // 新增配置项
        function addConfigItem() {
            const newItem = {
                name: `新奖项 ${tempConfig.length + 1}`,
                count: 1,
                color: getRandomColor()
            };
            
            tempConfig.push(newItem);
            renderConfigForm();
        }

        // 删除配置项
        function deleteConfigItem(index) {
            if (tempConfig.length <= 1) {
                alert('至少需要保留一个奖项！');
                return;
            }
            
            tempConfig.splice(index, 1);
            renderConfigForm();
        }

        // 显示中奖弹窗
        function showWinModal(prize) {
            document.getElementById('winPrize').textContent = prize;
            winModal.classList.add('active');
        }

        // 关闭中奖弹窗
        function closeWinModal() {
            winModal.classList.remove('active');
        }

        // 生成随机颜色
        function getRandomColor() {
            const colors = [
                '#FF6B6B', '#4ECDC4', '#FFD166', '#06D6A0', '#118AB2',
                '#EF476F', '#FFD166', '#06D6A0', '#118AB2', '#073B4C',
                '#7209B7', '#3A86FF', '#FB5607', '#8338EC', '#FF006E'
            ];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // 添加键盘快捷键支持
        document.addEventListener('keydown', function(e) {
            // ESC键关闭弹窗
            if (e.key === 'Escape') {
                if (configModal.classList.contains('active')) {
                    closeConfigModal();
                }
                if (winModal.classList.contains('active')) {
                    closeWinModal();
                }
            }
            
            // 空格键开始抽奖（当没有弹窗打开时）
            if (e.key === ' ' && !configModal.classList.contains('active') && !winModal.classList.contains('active')) {
                e.preventDefault();
                if (!isSpinning) {
                    startSpin();
                }
            }
        });

        // 添加页面加载完成提示
        window.addEventListener('load', function() {
            console.log('🎡 抽奖转盘已加载完成！');
            console.log('📋 默认配置：', defaultConfig);
            console.log('🎮 操作提示：');
            console.log('  1. 点击"开始抽奖"按钮或按空格键开始旋转');
            console.log('  2. 点击右上角"配置转盘"按钮自定义奖项');
            console.log('  3. 按ESC键可以关闭弹窗');
        });
    </script>
</body>
</html>
